services:
  db:
    image: postgres:16-alpine

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bitflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bitflow-local-only}
      POSTGRES_DB: ${POSTGRES_DB:-bitcoin_db}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - database

  app:
    build:
      context: .
      dockerfile: Dockerfile

    depends_on:
      db:
        condition: service_healthy

    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-bitflow}:${POSTGRES_PASSWORD:-bitflow-local-only}@db:5432/${POSTGRES_DB:-bitcoin_db}?connect_timeout=10&pool_timeout=10
      NODE_ENV: production
      BINANCE_API_BASE_URL: ${BINANCE_API_BASE_URL:-https://api.binance.com/api/v3}
      TRUST_PROXY: ${TRUST_PROXY:-false}

    ports:
      - "3000:3000"

    restart: unless-stopped

    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    networks:
      - default
      - database

    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  postgres_data:

networks:
  database:
    internal: true
