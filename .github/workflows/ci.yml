name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://bitflow:ci-only@127.0.0.1:5432/bitcoin_db

    services:
      postgres:
        image: postgres:18-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
        env:
          POSTGRES_USER: bitflow
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: bitcoin_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bitflow -d bitcoin_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check types
        run: npm run typecheck

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Apply database migrations
        run: npm run prisma:deploy

      - name: Build application
        run: npm run build

      - name: Verify production server and database
        run: |
          npm run start > /tmp/bitflow-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/api/health; then
              exit 0
            fi
            sleep 1
          done

          cat /tmp/bitflow-server.log
          exit 1
